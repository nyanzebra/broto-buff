[package]
name = "broto-buff"
resolver = "3"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nyanzebra/broto-buff"

[dependencies]
broto = { git = "https://github.com/nyanzebra/broto", branch = "main", optional = true }
serde = { version = "1", features = ["derive"] }
schemars = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
env_logger = "0.11"
serde_json = "1"
toml = "1"
yaml_serde = "0.10"

[features]
sync = ["dep:broto","broto/sync"]
async = ["dep:broto","broto/async"]
